server:
  port: 8088
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: knowledge
          uri: lb://business-knowledge-service
          predicates:
            - Path=/api/auth/**,/api/v1/runtime/**,/api/v1/admin/profiles/**,/api/v1/admin/dimensions/**,/api/v1/admin/options/**,/api/v1/admin/rules/**
        - id: crm
          uri: lb://crm-adapter-service
          predicates:
            - Path=/api/v1/admin/crm/**
        - id: notifications
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/admin/notifications/**
        - id: intake
          uri: lb://mail-ingestion-service
          predicates:
            - Path=/api/v1/intake/**
        - id: gmail
          uri: http://gmail-connector:8070
          predicates:
            - Path=/api/v1/admin/gmail/**,/api/v1/gmail/oauth/**
        - id: metrics
          uri: http://observability-service:8071
          predicates:
            - Path=/api/v1/admin/metrics/**
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
