server:
  port: 8082
spring:
  application:
    name: business-knowledge-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agnostic_router}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  security:
    admin-user: ${ADMIN_USER}
    admin-password: ${ADMIN_PASSWORD}
    cors-origin: ${CORS_ORIGIN:http://localhost:4200}
    jwt:
      secret: ${APP_JWT_SECRET}
      expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:120}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
