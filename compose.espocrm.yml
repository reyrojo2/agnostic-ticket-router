services:
  espocrm-db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${ESPOCRM_DB_ROOT_PASSWORD:?required}
      MARIADB_DATABASE: espocrm
      MARIADB_USER: espocrm
      MARIADB_PASSWORD: ${ESPOCRM_DB_PASSWORD:?required}
    volumes:
      - espocrm-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 20s
      interval: 20s
      timeout: 10s
      retries: 5

  espocrm:
    image: espocrm/espocrm:latest
    restart: unless-stopped
    depends_on:
      espocrm-db:
        condition: service_healthy
    environment:
      ESPOCRM_DATABASE_PLATFORM: Mysql
      ESPOCRM_DATABASE_HOST: espocrm-db
      ESPOCRM_DATABASE_NAME: espocrm
      ESPOCRM_DATABASE_USER: espocrm
      ESPOCRM_DATABASE_PASSWORD: ${ESPOCRM_DB_PASSWORD:?required}
      ESPOCRM_ADMIN_USERNAME: admin
      ESPOCRM_ADMIN_PASSWORD: ${ESPOCRM_ADMIN_PASSWORD:?required}
      ESPOCRM_SITE_URL: http://localhost:8080
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - espocrm-data:/var/www/html/data
      - espocrm-custom:/var/www/html/custom
      - espocrm-custom-client:/var/www/html/client/custom
    healthcheck:
      test: ["CMD", "bin/command", "app-check"]
      start_period: 30s
      interval: 60s
      timeout: 20s
      retries: 5

  espocrm-daemon:
    image: espocrm/espocrm:latest
    restart: unless-stopped
    volumes_from:
      - espocrm
    entrypoint: docker-daemon.sh
    depends_on:
      espocrm:
        condition: service_healthy

volumes:
  espocrm-db-data:
  espocrm-data:
  espocrm-custom:
  espocrm-custom-client: