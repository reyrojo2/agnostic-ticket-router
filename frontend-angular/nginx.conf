server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;

    location /api/auth/ {
        proxy_pass http://business-knowledge-service:8082;
        proxy_set_header Host $host;
    }
    location /api/v1/runtime/ {
        proxy_pass http://business-knowledge-service:8082;
        proxy_set_header Host $host;
    }
    location /api/v1/admin/profiles {
        proxy_pass http://business-knowledge-service:8082;
        proxy_set_header Host $host;
    }
    location /api/v1/admin/dimensions {
        proxy_pass http://business-knowledge-service:8082;
        proxy_set_header Host $host;
    }
    location /api/v1/admin/options {
        proxy_pass http://business-knowledge-service:8082;
        proxy_set_header Host $host;
    }
    location /api/v1/admin/rules {
        proxy_pass http://business-knowledge-service:8082;
        proxy_set_header Host $host;
    }
    location /api/v1/admin/crm/ {
        proxy_pass http://crm-adapter-service:8084;
        proxy_set_header Host $host;
    }
    location /api/v1/admin/notifications/ {
        proxy_pass http://notification-service:8085;
        proxy_set_header Host $host;
    }
    location /api/v1/admin/gmail/ { proxy_pass http://gmail-connector:8070; }
    location /api/v1/gmail/oauth/ { proxy_pass http://gmail-connector:8070; }
    location /api/v1/admin/metrics/ { proxy_pass http://observability-service:8071; }
    location /api/v1/intake/ {
        proxy_pass http://mail-ingestion-service:8081;
        proxy_set_header Host $host;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
