server:
  port: 8070
spring:
  application:
    name: gmail-connector
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agnostic_router}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
app:
  jwt-secret: ${APP_JWT_SECRET}
  gmail:
    client-id: ${GMAIL_CLIENT_ID:}
    client-secret: ${GMAIL_CLIENT_SECRET:}
    redirect-uri: ${GMAIL_REDIRECT_URI:http://localhost:4200/api/v1/gmail/oauth/callback}
    encryption-key: ${GMAIL_ENCRYPTION_KEY:}
    poll-seconds: ${GMAIL_POLL_SECONDS:90}
    intake-url: ${MAIL_INGESTION_URL:http://localhost:8081/api/v1/intake/emails}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
